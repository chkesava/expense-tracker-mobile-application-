<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Spendly share links</title>
    <!--
      Served at `/` with a 200, and deliberately not the app shell.

      Two separate reasons this page has to exist and has to return 200:

      1. index.html boots the whole app, so serving it at `/` would make this
         host a second, sign-in-able copy of Spendly. This page has no app JS.

      2. @react-native-community/netinfo's web default is a same-origin
         `HEAD /` with `reachabilityTest: response.status === 200`
         (see its internal/defaultConfiguration.web.js). Anything other than a
         200 there makes NetInfo report the internet as unreachable, which shows
         the app's OfflineBanner on a page that loaded perfectly well. A 404 at
         `/` therefore reads as "you are offline" to every visitor of
         /split/:slug on this host.

      Genuinely unmatched paths still get public/404.html with a real 404, which
      Netlify serves on its own -- netlify.toml has no catch-all.
    -->
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #fff;
        color: #1a1a1a;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        text-align: center;
      }
      main { max-width: 30rem; }
      h1 { margin: 0 0 0.5rem; font-size: 1.25rem; font-weight: 700; }
      p { margin: 0; color: #666; font-size: 0.9375rem; }
      @media (prefers-color-scheme: dark) {
        body { background: #071a2b; color: #f2f5f7; }
        p { color: #9aa8b4; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Spendly share links</h1>
      <p>
        This address opens shared splits and payment requests, and it needs the
        full link to do it. Ask whoever invited you to send it again.
      </p>
    </main>
  </body>
</html>
