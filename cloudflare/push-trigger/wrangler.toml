# SPENDLY-716: the push reminders trigger (and, since SPENDLY-729, the daily
# SIP and bill jobs that replace the legacy site's crons). A standalone Worker with only a cron
# trigger: no routes, no workers.dev URL, so nothing can call it from outside.
# Deploy and the token secret: docs/PUSH_RUNBOOK.md ("Reliable trigger").
name = "spendly-push-trigger"
main = "worker.ts"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[triggers]
# UTC. Every 15 minutes: push reminders (the hourly event pass runs in minutes
# 0-14). 03:00 daily (08:30 IST): sip-daily.yml and bill-daily.yml, each gated
# by its own repository variable (SIP_DAILY_ENABLED, BILL_DAILY_ENABLED).
crons = ["*/15 * * * *", "0 3 * * *"]
