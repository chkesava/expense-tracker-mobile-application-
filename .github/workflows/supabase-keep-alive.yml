name: Supabase Keep Alive

# Low-volume keep-alive for the Supabase Free project (SPENDLY-125).
#
# Free projects are paused after a stretch of low database activity, and
# Spendly's data lives in Firestore, so a quiet week can leave Postgres
# untouched. Every ~3 days this calls public.keep_alive() -- a `select 1`
# with no table behind it (supabase/keep-alive.sql). It reads nothing and
# writes nothing. It is not a proxy and must never run more often than the
# current Supabase Free-plan docs require. See docs/SUPABASE_KEEP_ALIVE.md.

on:
  schedule:
    # 06:17 UTC on days 1, 4, 7, ... -- off the top of the hour, when Actions
    # queues are busiest. The gap across a month boundary is 1-3 days.
    - cron: "17 6 */3 * *"
  workflow_dispatch:

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  keep-alive:
    name: Ping Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call public.keep_alive()
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::EXPO_PUBLIC_SUPABASE_URL or EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY is not set."
            exit 1
          fi

          # Only the apikey header: sb_publishable_ keys are not JWTs and are
          # rejected as a Bearer token, while legacy anon keys work either way.
          status=$(curl -sS --max-time 20 --retry 2 --retry-all-errors \
            -o body.json -w '%{http_code}' \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/keep_alive" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}') || status="000"
          body=$(tr -d '[:space:]' < body.json 2>/dev/null || true)
          rm -f body.json

          if [ "$status" = "000" ]; then
            echo "::error::Supabase could not be reached (network error or timeout)."
            exit 1
          fi

          if [ "$status" != "200" ] || [ "$body" != "1" ]; then
            # PostgREST error codes (e.g. PGRST202 = function missing) carry no
            # credentials; the response body itself is not printed.
            code=$(printf '%s' "$body" | jq -r '.code // empty' 2>/dev/null || true)
            echo "::error::keep_alive failed: HTTP $status${code:+ ($code)}. See docs/SUPABASE_KEEP_ALIVE.md."
            exit 1
          fi

          echo "keep_alive returned 1 (HTTP 200)."
          echo "Supabase keep-alive OK at $(date -u '+%Y-%m-%d %H:%M UTC') (HTTP $status)" >> "$GITHUB_STEP_SUMMARY"
