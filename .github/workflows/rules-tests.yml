name: Firestore rules tests

# The security-rule gate (GS-074).
#
# Defined once as a reusable workflow and called by pr-checks.yml,
# web-deploy.yml, and firestore-rules-deploy.yml, so the gate cannot drift
# between "what a PR checks" and "what a deploy checks" — which is exactly how
# a gate quietly stops gating.
#
# Why this exists at all: every other rules test in the repo is a hand-written
# TypeScript mirror of firestore.rules, and a mirror proves the mirror. Two real
# defects have shipped past one — GS-084 (an allowlist that omitted a field the
# app sends, which would have denied every admin role change) and GS-104 (the
# summary rule exceeding Firestore's 1000-expression evaluation budget, so
# legacy members could not record money at all). Neither was findable without
# running the real rules engine.
#
# Quality gate only. No Firebase service account, no signing keystore — this
# runs on fork PRs, so it must never be given release credentials. Uploading
# live rules is a separate workflow_dispatch job (firestore-rules-deploy.yml).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rules:
    name: Rules (Firestore emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator is a Java process, and firebase-tools 14+
      # refuses to start it on anything below JDK 21.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # Pinned rather than floating: firebase-tools controls both the emulator
      # and the rules engine version this gate tests against, and a silent
      # major bump would change what "passing" means.
      #
      # Retried because this is a ~400-package global install straight from the
      # registry with no lockfile and no cache behind it, so a single
      # ECONNRESET failed the whole rules gate on an unrelated commit. Retrying
      # the install is safe: the version is pinned, so every attempt resolves
      # to exactly the same tree.
      - name: Install Firebase CLI
        run: |
          for attempt in 1 2 3; do
            if npm install --global firebase-tools@15.29.0; then
              exit 0
            fi
            echo "::warning::firebase-tools install failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
          echo "::error::firebase-tools install failed after 3 attempts"
          exit 1

      - name: Cache emulator binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      # `npm run test:rules` starts the emulator around the suite. It is the
      # same command the runbook and every developer uses, deliberately — a CI
      # gate that runs something different from the local command is a gate
      # people learn to distrust.
      - name: Firestore rules tests
        run: npm run test:rules

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Firestore rules"
            echo ""
            echo "- Command: \`npm run test:rules\`"
            echo "- Runs the real rules engine in the Firestore emulator, not a mirror."
            echo "- Secrets used: **none**."
          } >> "$GITHUB_STEP_SUMMARY"
