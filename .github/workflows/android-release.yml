name: Android Release

# Manual only from Actions → Android Release → Run workflow.
# Never add pull_request here: fork PRs would gain access to the signing
# keystore and the Firebase service account.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.2.0). Defaults to auto-bumped patch from app.json.'
        required: false
        type: string
      mandatory:
        description: 'Force users to update before continuing'
        required: false
        default: false
        type: boolean
      notes:
        description: 'Release notes shown to testers and in the update prompt'
        required: false
        type: string

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build, distribute and announce
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so the bot can push the version bump commit back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      # Phase 10 quality gate — fail before secrets-heavy / APK work when tests break.
      # Intentionally placed before keystore restore so a bad main merge fails fast.
      - name: Unit + integration-lite suite
        run: npm test

      - name: Shared typecheck
        run: npm run typecheck:shared

      - name: Full app typecheck
        run: npm run typecheck

      - name: Restore .env
        env:
          MOBILE_ENV_FILE: ${{ secrets.MOBILE_ENV_FILE }}
          EXPO_PUBLIC_APP_URL: ${{ secrets.EXPO_PUBLIC_APP_URL }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$MOBILE_ENV_FILE" ]; then
            printf '%s\n' "$MOBILE_ENV_FILE" > .env
            echo "Wrote .env from MOBILE_ENV_FILE."
          else
            # Compose from individual secrets (matches how this repo's secrets were set up).
            : > .env
            write_kv() {
              local key="$1"
              local value="$2"
              if [ -n "$value" ]; then
                printf '%s=%s\n' "$key" "$value" >> .env
              fi
            }
            write_kv EXPO_PUBLIC_APP_URL "$EXPO_PUBLIC_APP_URL"
            write_kv EXPO_PUBLIC_FIREBASE_API_KEY "$EXPO_PUBLIC_FIREBASE_API_KEY"
            write_kv EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN "$EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN"
            write_kv EXPO_PUBLIC_FIREBASE_PROJECT_ID "$EXPO_PUBLIC_FIREBASE_PROJECT_ID"
            write_kv EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET "$EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET"
            write_kv EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER "$EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER"
            write_kv EXPO_PUBLIC_FIREBASE_APP_ID "$EXPO_PUBLIC_FIREBASE_APP_ID"
            write_kv EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID"
            write_kv MYAPP_RELEASE_STORE_PASSWORD "$MYAPP_RELEASE_STORE_PASSWORD"
            write_kv MYAPP_RELEASE_KEY_PASSWORD "$MYAPP_RELEASE_KEY_PASSWORD"
            echo "Wrote .env from individual EXPO_PUBLIC_* secrets."
          fi

          KEY_COUNT=$(grep -c '^EXPO_PUBLIC_' .env || true)
          if [ "$KEY_COUNT" -lt 7 ]; then
            echo "::error::Need the Firebase EXPO_PUBLIC_* secrets (or one MOBILE_ENV_FILE). Found $KEY_COUNT EXPO_PUBLIC_* lines."
            exit 1
          fi
          if ! grep -q '^EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=.' .env; then
            echo "::warning::EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID is missing — Google Sign-In may fail in the release APK. Add that secret and re-run."
          fi
          echo "Wrote .env with $KEY_COUNT EXPO_PUBLIC_* keys."

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty."
            exit 1
          fi
          mkdir -p keystores
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystores/expense-tracker-upload-key.keystore
          echo "Keystore restored ($(stat -c%s keystores/expense-tracker-upload-key.keystore) bytes)."

      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is empty."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "${{ runner.temp }}/service-account.json"
          chmod 600 "${{ runner.temp }}/service-account.json"

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          VERSION_CODE_OFFSET: ${{ vars.VERSION_CODE_OFFSET }}
        run: |
          CURRENT_NAME=$(node -p "require('./app.json').expo.version")
          CURRENT_CODE=$(node -p "Number(require('./app.json').expo.android.versionCode)||0")

          VERSION_NAME="$INPUT_VERSION"
          if [ -z "$VERSION_NAME" ]; then
            # Each manual release advances the patch: 1.1.0 → 1.1.1
            VERSION_NAME=$(node -e "const {bumpPatchVersion}=require('./scripts/common'); console.log(bumpPatchVersion(process.argv[1]))" "$CURRENT_NAME")
          fi

          OFFSET="${VERSION_CODE_OFFSET:-27}"
          VERSION_CODE=$((OFFSET + GITHUB_RUN_NUMBER))
          # Never go backwards relative to what is already in app.json.
          if [ "$VERSION_CODE" -le "$CURRENT_CODE" ]; then
            VERSION_CODE=$((CURRENT_CODE + 1))
          fi

          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building v$VERSION_NAME (build $VERSION_CODE) from base v$CURRENT_NAME (build $CURRENT_CODE)"

      - name: Resolve release notes
        id: notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          NOTES="$INPUT_NOTES"
          if [ -z "$NOTES" ]; then
            NOTES=$(git log -1 --pretty=%s)
          fi
          {
            echo 'value<<RELEASE_NOTES_EOF'
            echo "$NOTES"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # verify-environment.js and verify-gradle.js both require android/ to
      # exist, so prebuild has to run before release:verify / the APK build.
      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      - name: Release environment verify
        env:
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run release:verify

      - name: Build signed release APK
        env:
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node scripts/release.js \
            --skip-prebuild \
            --version=${{ steps.version.outputs.name }} \
            --version-code=${{ steps.version.outputs.code }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-v${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}
          path: releases/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Distribute to Firebase App Distribution
        id: distribute
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: releases/app-release.apk
          releaseNotes: |
            v${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})
            ${{ steps.notes.outputs.value }}

      # Prefer the durable tester / console share link. Binary download URIs from
      # App Distribution often expire and break the in-app update button later.
      - name: Resolve download URL
        id: download
        env:
          TESTING_URI: ${{ steps.distribute.outputs.TESTING_URI }}
          BINARY_URI: ${{ steps.distribute.outputs.BINARY_DOWNLOAD_URI }}
          CONSOLE_URI: ${{ steps.distribute.outputs.FIREBASE_CONSOLE_URI }}
        run: |
          URL="${TESTING_URI:-${BINARY_URI:-$CONSOLE_URI}}"
          if [ -z "$URL" ]; then
            echo "::error::Firebase App Distribution did not emit a download URL."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Using download URL: $URL"

      - name: Publish release metadata to Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
          RELEASE_DOWNLOAD_URL: ${{ steps.download.outputs.url }}
          RELEASE_NOTES: ${{ steps.notes.outputs.value }}
          RELEASE_MANDATORY: ${{ inputs.mandatory || false }}
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: node scripts/publish-release-metadata.js

      # Persist the bumped version so the next manual release continues 1.1.1 → 1.1.2.
      - name: Commit version bump
        if: success()
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json package.json
          if git diff --staged --quiet; then
            echo "Version files already match v${VERSION_NAME} (build ${VERSION_CODE})."
          else
            git commit -m "chore: bump version to v${VERSION_NAME} (build ${VERSION_CODE}) [skip ci]"
            git push
            echo "Committed and pushed version bump."
          fi

      - name: Clean up credentials
        if: always()
        run: |
          rm -f "${{ runner.temp }}/service-account.json"
          rm -f keystores/expense-tracker-upload-key.keystore
          rm -f .env

      - name: Job summary
        if: success()
        run: |
          {
            echo "## Android release published"
            echo ""
            echo "- Version: **v${{ steps.version.outputs.name }}** (build ${{ steps.version.outputs.code }})"
            echo "- Notes: ${{ steps.notes.outputs.value }}"
            echo "- Mandatory update: ${{ inputs.mandatory || false }}"
            echo "- Download: ${{ steps.download.outputs.url }}"
            echo "- Testers link: ${{ steps.distribute.outputs.TESTING_URI }}"
            echo ""
            echo "### Quality gate (Phase 10)"
            echo "- \`npm test\` — passed before APK"
            echo "- \`npm run typecheck:shared\` / \`typecheck\` — passed before APK"
            echo "- \`npm run release:verify\` — passed after prebuild, before APK"
            echo "- SMS device pack — deferred (SMS not on this branch)"
          } >> "$GITHUB_STEP_SUMMARY"
