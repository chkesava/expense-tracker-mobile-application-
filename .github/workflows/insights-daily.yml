name: Insights daily

# SPENDLY-747 (epic SPENDLY-735): fee intelligence (the full-ledger fee
# scan) and the Journal health report, computed on the server for users whose
# inputs changed since their last result, stored at users/{uid}/serverResults.
# Rules: scripts/lib/insightsDailyCore.ts.
#
# The Cloudflare Worker `spendly-push-trigger` dispatches this workflow on its
# daily 03:00 UTC tick (08:30 IST) with `trigger: cron`, which runs only when
# the repository variable INSIGHTS_DAILY_ENABLED is "true". A manual
# dispatch always runs (dry run by default).
#
# Secrets: FIREBASE_SERVICE_ACCOUNT (or INSIGHTS_FIREBASE_SERVICE_ACCOUNT),
#          READMODEL_SUPABASE_SERVICE_ROLE_KEY (required: change detection and the read-model push)
# Variables: INSIGHTS_DAILY_ENABLED, READMODEL_SUPABASE_URL, INSIGHTS_MAX_READS_PER_RUN

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide and log, write nothing"
        required: true
        default: true
        type: boolean
      trigger:
        description: "Who started the run. The Cloudflare Worker sends cron, which obeys INSIGHTS_DAILY_ENABLED."
        required: false
        default: manual
        type: choice
        options:
          - manual
          - cron

concurrency:
  group: insights-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: Fee rows and ledger health
    if: vars.INSIGHTS_DAILY_ENABLED == 'true' || inputs.trigger != 'cron'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The job never pushes; don't leave the token in git config.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run
        env:
          INSIGHTS_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.INSIGHTS_FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT }}
          READMODEL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.READMODEL_SUPABASE_SERVICE_ROLE_KEY }}
          READMODEL_SUPABASE_URL: ${{ vars.READMODEL_SUPABASE_URL }}
          INSIGHTS_MAX_READS_PER_RUN: ${{ vars.INSIGHTS_MAX_READS_PER_RUN || '8000' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "$INSIGHTS_FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT (or INSIGHTS_FIREBASE_SERVICE_ACCOUNT) is not set."
            exit 1
          fi
          args=""
          if [ "$DRY_RUN" = "true" ]; then args="--dry-run"; fi
          npx --no-install tsx scripts/insights-daily.ts $args | tee insights-daily.log
          {
            echo "## Insights daily"
            echo '```json'
            sed -n '/^{/,/^}/p' insights-daily.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
