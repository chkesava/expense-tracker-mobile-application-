name: Release (reusable)

on:
  workflow_call:
    inputs:
      product:
        required: true
        type: string
      version:
        required: false
        type: string
      mandatory:
        required: false
        default: false
        type: boolean
      notes:
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build, distribute and announce
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Validate product input
        run: |
          case "${{ inputs.product }}" in
            expense|nutrition|ganesh) ;;
            *)
              echo "::error::Unknown product '${{ inputs.product }}'"
              exit 1
              ;;
          esac
