name: Subscription daily

# SPENDLY-739 (epic SPENDLY-735): the daily server posting of due subscriptions,
# EMIs and recurring transfers. The app no longer auto-posts them on launch.
# Rules: scripts/lib/subscriptionDailyCore.ts.
#
# The Cloudflare Worker `spendly-push-trigger` dispatches this workflow on its
# daily 03:00 UTC tick (08:30 IST) with `trigger: cron`, which runs only when
# the repository variable SUBSCRIPTION_DAILY_ENABLED is "true". A manual
# dispatch always runs (dry run by default) so a production preview is
# possible before enabling.
#
# With the read-model settings, only users whose copied subscriptions show
# something due are read from Firestore; each charge is then planned and
# written from Firestore (READ_MODEL_RULES R4.3a).
#
# Secrets: FIREBASE_SERVICE_ACCOUNT (or SUBSCRIPTION_FIREBASE_SERVICE_ACCOUNT),
#          READMODEL_SUPABASE_SERVICE_ROLE_KEY (optional: finder + read-model push)
# Variables: SUBSCRIPTION_DAILY_ENABLED, READMODEL_SUPABASE_URL,
#            SUBSCRIPTION_MAX_READS_PER_RUN, SUBSCRIPTION_READMODEL_FINDER

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide and log every charge, write nothing"
        required: true
        default: true
        type: boolean
      trigger:
        description: "Who started the run. The Cloudflare Worker sends cron, which obeys SUBSCRIPTION_DAILY_ENABLED."
        required: false
        default: manual
        type: choice
        options:
          - manual
          - cron

concurrency:
  group: subscription-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: Post due subscriptions and EMIs
    if: vars.SUBSCRIPTION_DAILY_ENABLED == 'true' || inputs.trigger != 'cron'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The job never pushes; don't leave the token in git config.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run
        env:
          SUBSCRIPTION_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.SUBSCRIPTION_FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT }}
          READMODEL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.READMODEL_SUPABASE_SERVICE_ROLE_KEY }}
          READMODEL_SUPABASE_URL: ${{ vars.READMODEL_SUPABASE_URL }}
          SUBSCRIPTION_MAX_READS_PER_RUN: ${{ vars.SUBSCRIPTION_MAX_READS_PER_RUN || '3000' }}
          SUBSCRIPTION_READMODEL_FINDER: ${{ vars.SUBSCRIPTION_READMODEL_FINDER || 'on' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "$SUBSCRIPTION_FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT (or SUBSCRIPTION_FIREBASE_SERVICE_ACCOUNT) is not set."
            exit 1
          fi
          args=""
          if [ "$DRY_RUN" = "true" ]; then args="--dry-run"; fi
          npx --no-install tsx scripts/subscription-daily.ts $args | tee subscription-daily.log
          {
            echo "## Subscription daily"
            echo '```json'
            sed -n '/^{/,/^}/p' subscription-daily.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
