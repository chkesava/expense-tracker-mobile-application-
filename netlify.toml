# Netlify build for the Expo web export.
#
# This site exists so the public share pages (/split/:slug) render for people
# who have no account. Share links keep the kesavaexpensetracker.netlify.app
# origin and are proxied here — those [[redirects]] live in the expense-tracker
# (Vite) repo, above its /* -> /index.html catch-all.
#
# web.output is "single" (SPA): `expo export` emits one index.html plus /_expo/**
# and /assets/**. Dynamic routes ([slug]) cannot be statically rendered without
# generateStaticParams, and split slugs are minted at runtime, so there is no
# build-time list to generate from.

[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  # Matches .github/workflows/pr-checks.yml and android-release.yml.
  NODE_VERSION = "22"
  # EXPO_PUBLIC_* values are inlined into the client bundle by design. Without
  # this, Netlify's secrets scanner fails the build on finding a declared env
  # var value inside dist/.
  SECRETS_SCAN_OMIT_KEYS = "EXPO_PUBLIC_FIREBASE_API_KEY,EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN,EXPO_PUBLIC_FIREBASE_PROJECT_ID,EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET,EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER,EXPO_PUBLIC_FIREBASE_APP_ID,EXPO_PUBLIC_APP_URL,EXPO_PUBLIC_SHARE_URL"

# Share links are semi-private. Keep the whole site out of search indexes.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Content-hashed bundles and assets.
[[headers]]
  for = "/_expo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback, deliberately scoped to the two public routes rather than "/*".
# expo-router does client-side routing, so a share path has to be served
# index.html for the slug to resolve -- but index.html boots the WHOLE app, so a
# blanket fallback would make this host a second, fully sign-in-able copy of it
# (/dashboard, /settings, ... all reachable). Only these two exist to be public.
[[redirects]]
  from = "/split/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/payment/*"
  to = "/index.html"
  status = 200

# `/` has to be forced: it resolves to the real index.html, and Netlify will not
# shadow an existing file otherwise, so without this the bare domain boots the
# whole app. A 404 rather than a redirect, because this host is self-contained
# and genuinely has nothing at its root -- public/404.html says so in a line.
[[redirects]]
  from = "/"
  to = "/404.html"
  status = 404
  force = true

# There is deliberately NO catch-all. Every other path (/dashboard, /settings,
# ...) has no file behind it, so Netlify serves public/404.html by itself. That
# leaves no app surface on this host and no dependency on any other origin.
# Real files -- /_expo/**, /assets/**, /favicon.ico, /robots.txt -- keep being
# served, which matters because index.html references those bundles absolutely.
